<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background 3D Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b72" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>

    <!-- Lightning Bolt 3D Glow Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#ffe4e6" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#ffffff" flood-opacity="0.6" />
    </filter>

    <radialGradient id="ringGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base with 3D Depth -->
  <rect x="32" y="32" width="448" height="448" rx="110" fill="url(#bgGrad)" filter="drop-shadow(0px 24px 32px rgba(225, 29, 72, 0.45))" />
  
  <!-- Gloss Top Highlight -->
  <rect x="32" y="32" width="448" height="224" rx="110" fill="url(#ringGlow)" />

  <!-- 3D Lightning Bolt Icon -->
  <path d="M280 80 L140 270 L250 270 L232 432 L372 242 L262 242 Z" 
        fill="url(#boltGrad)" 
        filter="url(#glow)" />
</svg>
