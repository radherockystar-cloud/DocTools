<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>DocTools - Superfast Image & PDF Micro Tools</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="min-h-screen flex flex-col font-sans transition-colors duration-200">
    <div id="app" class="flex flex-col min-h-screen"></div>

    <script type="module" src="/src/main.js"></script>

    <!-- Auto-Update Engine -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            // Check for updates on every app launch
            reg.update();
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // Naya update milte hi page auto-refresh ho jayega
                  window.location.reload();
                }
              });
            });
          });
        });
      }
    </script>
  </body>
</html>
