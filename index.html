<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>DocTools - Superfast Image & PDF Micro Tools</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="min-h-screen flex flex-col font-sans transition-colors duration-200">
    <div id="app" class="flex flex-col min-h-screen"></div>

    <script type="module" src="/src/main.js"></script>

    <!-- Auto Cache-Killer & Live Sync -->
    <script>
      if ('caches' in window) {
        caches.keys().then((names) => {
          names.forEach((name) => caches.delete(name));
        });
      }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (let reg of registrations) {
            reg.unregister();
          }
        });
      }
    </script>
  </body>
</html>
